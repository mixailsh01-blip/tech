<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Технический помощник</title>
  <script>
    // Восстанавливаем "красивый" путь после редиректа из 404.html
    // (см. https://github.com/rafgraph/spa-github-pages)
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #07090d;
    }
  </style>
</head>
<body>
  <script>
    const WEBHOOK_BASE = "https://quumahienot.beget.app/webhook/";
    const FETCH_TIMEOUT_MS = 9000;
    const FETCH_RETRIES = 3;

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Действие берём из ?type=, затем из ?tag= (для обратной совместимости),
    // и не отправляем сам этот параметр в теле вебхука.
    function getTagParamName() {
      const qs = new URLSearchParams(window.location.search);
      if (qs.get("type") && qs.get("type").trim()) return "type";
      if (qs.get("tag") && qs.get("tag").trim()) return "tag";
      return null;
    }

    function getTag() {
      const qs = new URLSearchParams(window.location.search);
      const name = getTagParamName();
      if (name) return qs.get(name).trim();

      const segments = window.location.pathname.split("/").filter(Boolean);
      if (!segments.length) return "";
      const last = segments[segments.length - 1];
      if (!last || /index\.html?$/i.test(last)) return "";
      return decodeURIComponent(last);
    }

    function getPayloadParams() {
      const skip = getTagParamName();
      const params = {};
      new URLSearchParams(window.location.search).forEach((value, key) => {
        if (key === skip) return;
        params[key] = value;
      });
      return params;
    }

    async function fetchWithTimeout(url, options, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal, cache: "no-store" });
      } finally {
        clearTimeout(timer);
      }
    }

    async function sendWebhook(tag, params) {
      const url = WEBHOOK_BASE + encodeURIComponent(tag);

      for (let attempt = 1; attempt <= FETCH_RETRIES; attempt += 1) {
        try {
          const resp = await fetchWithTimeout(
            url,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Cache-Control": "no-cache"
              },
              body: JSON.stringify({ ...params, t: Date.now() })
            },
            FETCH_TIMEOUT_MS
          );

          if (!resp.ok) throw new Error(`Webhook error ${resp.status}`);
          return true;
        } catch (err) {
          if (attempt < FETCH_RETRIES) {
            await sleep(350 * attempt);
          }
        }
      }
      return false;
    }

    function tryCloseWindow() {
      // Работает только если вкладка открыта скриптом (window.open) —
      // браузер блокирует self-close для обычной навигации по ссылке.
      window.close();
      // Если закрыть не удалось (вкладка осталась открыта), очищаем страницу.
      setTimeout(() => {
        document.title = "Готово";
        document.body.innerHTML = "";
      }, 300);
    }

    async function init() {
      const tag = getTag();
      const params = getPayloadParams();

      if (!tag) return;

      await sendWebhook(tag, params);
      tryCloseWindow();
    }

    init();
  </script>
</body>
</html>
