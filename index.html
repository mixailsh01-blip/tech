<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Технический помощник</title>
  <script>
    // Восстанавливаем "красивый" путь после редиректа из 404.html
    // (см. https://github.com/rafgraph/spa-github-pages)
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
  <style>
    :root {
      --bg0: #07090d;
      --bg1: #0d1118;
      --panel: #121822;
      --line: #2a3446;
      --line-strong: #3c4c68;
      --text: #ecf2ff;
      --muted: #9fb0cf;
      --accent: #4ea1ff;
      --accent-2: #1f6feb;
      --ok: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(1200px 500px at 10% -20%, #18335766, transparent),
        radial-gradient(1000px 500px at 90% 120%, #1c2f4d66, transparent),
        linear-gradient(145deg, var(--bg0), var(--bg1));
      color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
    }

    #app {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .panel {
      width: min(560px, 100%);
      background: linear-gradient(180deg, #151d29, #111826);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px #00000066;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      letter-spacing: .2px;
    }

    .muted {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .chip {
      border: 1px solid var(--line-strong);
      color: #c9daff;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: #111928;
      white-space: nowrap;
    }

    .params {
      margin: 14px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0e131c;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted);
      max-height: 160px;
      overflow: auto;
    }

    .params div { margin: 2px 0; }
    .params b { color: #cfe0ff; }

    .toolbar {
      margin: 14px 0 4px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .retry {
      border: 1px solid var(--line-strong);
      background: #172236;
      color: #eaf2ff;
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 13px;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .retry:hover { border-color: var(--accent); }
    .retry:active { transform: translateY(1px) scale(.99); }
    .retry:disabled { opacity: .6; cursor: not-allowed; }

    #status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      min-height: 20px;
    }

    #status.ok { color: var(--ok); }
    #status.err { color: var(--danger); }

    .hint {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    code {
      background: #0e131c;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1px 5px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="panel">
      <div class="row">
        <h1>Технический помощник</h1>
        <span class="chip" id="tagChip">—</span>
      </div>
      <p class="muted" id="subtitle">Определяю действие...</p>

      <div class="params" id="paramsBox"></div>

      <div class="toolbar">
        <button class="retry" id="retryBtn" type="button">Повторить</button>
      </div>
      <div id="status">Подготовка...</div>

      <div class="hint">
        Формат ссылки: <code>.../ДЕЙСТВИЕ?id=XXXX</code> (например
        <code>.../InstallLicense?id=1234</code>) или
        <code>?tag=ДЕЙСТВИЕ&id=XXXX</code>.
      </div>
    </section>
  </main>

  <script>
    const WEBHOOK_BASE = "https://quumahienot.beget.app/webhook/";
    const FETCH_TIMEOUT_MS = 9000;
    const FETCH_RETRIES = 3;

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function getQueryParams() {
      const params = {};
      new URLSearchParams(window.location.search).forEach((value, key) => {
        if (key === "tag") return;
        params[key] = value;
      });
      return params;
    }

    function getTag() {
      const fromQuery = new URLSearchParams(window.location.search).get("tag");
      if (fromQuery && fromQuery.trim()) return fromQuery.trim();

      const segments = window.location.pathname.split("/").filter(Boolean);
      if (!segments.length) return "";

      const last = segments[segments.length - 1];
      if (!last || /index\.html?$/i.test(last)) return "";
      return decodeURIComponent(last);
    }

    function setStatus(text, cls) {
      const status = document.getElementById("status");
      status.classList.remove("ok", "err");
      if (cls) status.classList.add(cls);
      status.textContent = text;
    }

    function renderParams(tag, params) {
      document.getElementById("tagChip").textContent = tag || "нет действия";
      document.getElementById("subtitle").textContent = tag
        ? `Действие: ${tag}`
        : "Действие не указано в ссылке";

      const box = document.getElementById("paramsBox");
      const entries = Object.entries(params);
      if (!entries.length) {
        box.innerHTML = "<div>Параметров нет</div>";
        return;
      }
      box.innerHTML = entries
        .map(([k, v]) => `<div><b>${k}</b>: ${v}</div>`)
        .join("");
    }

    async function fetchWithTimeout(url, options, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal, cache: "no-store" });
      } finally {
        clearTimeout(timer);
      }
    }

    async function sendWebhook(tag, params, disableUi) {
      const url = WEBHOOK_BASE + encodeURIComponent(tag);
      let lastError = null;

      for (let attempt = 1; attempt <= FETCH_RETRIES; attempt += 1) {
        try {
          setStatus(`Отправка запроса... попытка ${attempt}/${FETCH_RETRIES}`);

          const resp = await fetchWithTimeout(
            url,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Cache-Control": "no-cache"
              },
              body: JSON.stringify({ ...params, t: Date.now() })
            },
            FETCH_TIMEOUT_MS
          );

          if (!resp.ok) throw new Error(`Webhook error ${resp.status}`);

          setStatus("Готово", "ok");
          disableUi(false);
          return;
        } catch (err) {
          lastError = err;
          if (attempt < FETCH_RETRIES) {
            await sleep(350 * attempt);
          }
        }
      }

      setStatus("Не удалось отправить запрос. Нажмите «Повторить».", "err");
      disableUi(false);
    }

    async function init() {
      const tag = getTag();
      const params = getQueryParams();
      renderParams(tag, params);

      const retryBtn = document.getElementById("retryBtn");
      const disableUi = (disabled) => {
        retryBtn.disabled = disabled;
      };

      if (!tag) {
        setStatus("Действие не указано. Добавьте /ДЕЙСТВИЕ к ссылке.", "err");
        retryBtn.disabled = true;
        return;
      }

      const run = () => {
        disableUi(true);
        sendWebhook(tag, params, disableUi);
      };

      retryBtn.addEventListener("click", run);
      run();
    }

    init();
  </script>
</body>
</html>
